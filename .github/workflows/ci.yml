# PULSE·16 CI — 커밋할 때마다 도는 안전장치.
#
# 두 단계로 나눈 이유: 정적 검사는 Node 만 있으면 몇 초에 끝나는데, 브라우저
# 검사는 크로미움을 받아야 해서 몇 분이 든다. 값싼 것을 먼저 돌려 거기서
# 걸리면 비싼 것을 아예 시작하지 않는다(`needs: static`).
#
# ⚠ 검사 목록을 여기에 적지 마라. 목록은 `tools/ci/all.mjs` 한 곳에 있다.
#   예전에는 이 파일과 README 양쪽에 손으로 적혀 있었고, 그래서 갈라졌다 —
#   README 대로 다 돌려도 세 검사가 빠져 CI 에서만 떨어지는 상태였다.
#   검사를 더하려면 `all.mjs` 의 CHECKS 에 한 줄 넣으면 여기도 따라온다.
#   각 검사가 무엇을 보장하는지는 `tools/ci/` 의 스크립트 머리말에 있다.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 같은 브랜치에 연달아 밀면 앞의 실행을 취소한다 — 어차피 뒤엣것만 의미가 있다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── 1단계 · 정적 검사 ── 외부 의존성 0. Node 만 있으면 된다.
  static:
    name: 정적 검사 (문법 · 전역 충돌 · 로드 순서 · 문서 동기)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: 정적 검사 전부
        run: node tools/ci/all.mjs --static

  # ── 2단계 · 브라우저 검사 ── static 이 통과했을 때만 돈다.
  browser:
    name: 브라우저 검사 (스모크 · 회귀 · 프로파일 · 레이아웃)
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mcp/pulse-audit/package-lock.json

      # 이 저장소에서 npm 이 필요한 곳은 여기 한 군데다 (.gitignore 참고).
      - name: 의존성 복원
        working-directory: mcp/pulse-audit
        run: npm ci

      # playwright 버전이 바뀔 때만 브라우저를 새로 받는다.
      # lock 파일 해시를 키에 넣어 두면 버전 고정이 그대로 캐시 키가 된다.
      - name: 크로미움 캐시
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('mcp/pulse-audit/package-lock.json') }}

      - name: 크로미움 내려받기
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: mcp/pulse-audit
        run: npx playwright install --with-deps chromium

      # 캐시가 맞았어도 OS 의존 패키지는 이미지에 없을 수 있으므로 그것만 채운다
      - name: 크로미움 실행 의존성
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: mcp/pulse-audit
        run: npx playwright install-deps chromium

      # 회귀 시험의 45초 재생 구간은 CI 에서 줄이지 않는다 —
      # liveNodes 누수는 짧게 돌리면 안 드러난다(--quick 은 손으로 볼 때만).
      - name: 브라우저 검사 전부
        run: node tools/ci/all.mjs --browser
