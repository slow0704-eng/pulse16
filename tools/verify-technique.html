<title>PULSE·16 주법 변형 검증</title>
<style>body{font-family:monospace;background:#16191d;color:#e6e1d6;padding:20px;font-size:12px}
pre{white-space:pre-wrap}</style>
<pre id="out">검증 준비 중…</pre>

<!-- 주법(technique) 변형 36종이 «원 악기와, 의도한 방향으로 다른가» 를 잽니다.
     engines.js 의 주석이 주장하는 것을 그대로 수치로 옮긴 것입니다 —
     «펑크 커팅은 짧다» 를 «기음이 −20dB 떨어지는 데 clean 의 1/3» 로,
     «하모닉스는 한 옥타브 위» 를 «2f0 가 f0 보다 세다» 로.
     사람이 들어야 알던 것을 기계가 봅니다.

     ⚠ 앱 코드를 복사하지 않습니다 — measure-*.html 과 같은 방식으로
       src/ 를 그대로 로드하고 _app-harness.js 가 dom·ui·main 을 메웁니다.
     ⚠ measure-*.html 과 달리 ENGINES 를 훑지 **않습니다**. 주법마다 주장이
       달라 재는 법도 달라서입니다. 대신 마지막 절이 «ENGINES 에 있는데 아래
       표에 안 적힌 주법» 을 세어, 조용히 안 검사되는 일을 막습니다.
     ⚠ 다른 verify-*.html 과 마찬가지로 손으로 돌리는 도구입니다(CI 아님) —
       렌더가 50번이라 7~9분 걸립니다.

     재는 자를 고르며 배운 것 — 잘못 재면 멀쩡한 주법이 틀렸다고 나옵니다.
       · 광대역 포락선의 −20dB 는 **픽 어택이 죽는 속도**를 잽니다. 현의 길이는
         기음 성분으로 재야 합니다(pick 12ms ↔ 520ms. 하네스 hDecayAt 주석과 같은 함정).
       · 지속부 중심(0.03~0.23s)은 48ms 만에 죽는 닫힌 햇에는 못 씁니다 —
         그때는 이미 신호가 없어 꼬리를 재고 있습니다. 어택 중심(centA)을 씁니다.
       · 스테레오 팬을 모노로 합치면 변조가 **두 배**로 보입니다(L+R 이 팬의 우함수).
         레슬리·수트케이스는 한 채널만 봐야 5.2Hz 가 5.2Hz 로 나옵니다.
       · 기타 포락선에는 어느 엔진에나 27ms 안팎의 잔물결이 있어 타점 세기로는
         롤을 못 셉니다. 그래서 롤은 «같은 엔진에서 rolls 만 뗀 것» 과 견줍니다. -->
<script src="../src/core/config.js"></script>
<script src="../src/core/engines.js"></script>
<script src="../src/core/scale.js"></script>
<script src="_app-harness.js"></script>
<script src="../src/core/state.js"></script>
<script src="../src/core/util.js"></script>
<script src="../src/audio/modal.js"></script>
<script src="../src/audio/graph.js"></script>
<script src="../src/audio/params.js"></script>
<script src="../src/audio/string.js"></script>
<script src="../src/audio/struck.js"></script>
<script src="../src/audio/voice-drum.js"></script>
<script src="../src/audio/voice-bass.js"></script>
<script src="../src/audio/voice-keys.js"></script>
<script src="../src/audio/voice-gtr.js"></script>

<script>
(async () => {
const outEl = document.getElementById('out');
const log = m => { outEl.textContent += '\n' + m; };
outEl.textContent = '';

try{
await loadKnobDefaults();
/* measure-voices.html 과 같은 조건 — 휴머나이즈 0, 튠 노브 0.
   그래야 두 표의 숫자를 곧바로 견줄 수 있습니다. */
KNOB.hum='0'; KNOB.ktune='0'; KNOB.stune='0'; KNOB.ttune='0'; KNOB.htune='0';

const SR = 48000;

/* ── 렌더 ────────────────────────────────────────────────── */
const memo = new Map();
async function once(k, fn){ if(!memo.has(k)) memo.set(k, await fn()); return memo.get(k); }

const rDrum = (track,e) => once('D|'+track+'|'+e, async () => {
  const c = offlineBoot(1.2);
  probeTrack(track); FIRE[track](0.01, 1.0, e);        // 앱의 디스패치표 그대로
  return hMono(await c.startRendering());
});
const rGtr = (e,midi,dur) => once('G|'+e+'|'+midi+'|'+dur, async () => {
  const c = offlineBoot(dur + 1.8);
  probeTrack('gtr');
  gtrOct = midi; rootNote = 0; UI.gsemi.value = 0; scaleName = 'Minor Pentatonic';
  guitarVoice(0.01, 0, dur, e);                        // SCALES[..][0] === 0
  return hMono(await c.startRendering());
});
const rBass = (e,midi,dur) => once('B|'+e+'|'+midi+'|'+dur, async () => {
  const c = offlineBoot(dur + 1.8);
  probeTrack('bass');
  baseOct = midi; rootNote = 0; UI.bsemi.value = 0; scaleName = 'Minor Pentatonic';
  bassVoice(0.01, 0, dur, e);
  return hMono(await c.startRendering());
});
const rKeys = (e,midi,dur) => once('K|'+e+'|'+midi+'|'+dur, async () => {
  const c = offlineBoot(dur + 2.2);
  probeTrack('keys'); keysVoice(0.01, midi, dur, 0.9, e);
  return hMono(await c.startRendering());
});
/* 팬이 걸린 엔진은 모노로 합치면 안 된다 — 왼쪽 채널만 꺼낸다 */
const rKeysL = (e,midi,dur) => once('KL|'+e+'|'+midi+'|'+dur, async () => {
  const c = offlineBoot(dur + 2.2);
  probeTrack('keys'); keysVoice(0.01, midi, dur, 0.9, e);
  return (await c.startRendering()).getChannelData(0).slice();
});
/* 두 음을 잇달아 — 포르타멘토는 «앞 음» 이 있어야 재어집니다 */
const rKeys2 = (e,m1,m2,gap) => once('K2|'+e+'|'+m1+'|'+m2, async () => {
  const c = offlineBoot(gap + 1.8);
  probeTrack('keys');
  keysVoice(0.01, m1, gap*0.8, 0.9, e);
  keysVoice(0.01+gap, m2, 0.6, 0.9, e);
  return hMono(await c.startRendering());
});

/* ── 재는 자 ─────────────────────────────────────────────── */

/** RMS 포락선. Wms 창 · 1ms 홉. 창을 넓히면 음정 주기의 잔물결이 지워집니다. */
function envMs(d, Wms){
  const w = Math.round(SR*Wms/1000), h = Math.round(SR*0.001), e = [];
  for(let i=0;i+w<d.length;i+=h){ let s=0; for(let k=0;k<w;k++) s+=d[i+k]*d[i+k]; e.push(Math.sqrt(s/w)); }
  return e;
}
/** 포락선 값(선형) — t 초 시점 */
const envAt = (e, t) => e[Math.min(Math.max(Math.round(t*1000),0), e.length-1)];
const envPeak = e => { let m=0; for(const v of e) if(v>m) m=v; return m; };

/** 타점 — 국소 최대를 센 것부터 집고 sepMs 안쪽은 눌러 버립니다.
    플램·롤은 «몇 번, 언제 쳤는가» 가 곧 주법이라 이걸로 봅니다. */
function onsets(d, Wms, thr, sepMs){
  const e = envMs(d,Wms), mx = envPeak(e), lim = mx*thr, cand = [];
  for(let i=1;i<e.length-1;i++) if(e[i]>=e[i-1] && e[i]>e[i+1] && e[i]>=lim) cand.push([i,e[i]]);
  cand.sort((a,b)=>b[1]-a[1]);
  const take = [];
  for(const c of cand){
    let near=false;
    for(const t of take) if(Math.abs(t[0]-c[0]) < sepMs) near=true;
    if(!near) take.push(c);
  }
  take.sort((a,b)=>a[0]-b[0]);
  return take.map(p => ({ms:p[0], amp:p[1]}));
}
const gaps = o => o.slice(1).map((x,i)=> x.ms - o[i].ms);

/** 광대역 포락선이 −dB 까지 떨어지는 ms. 어택이 뭉툭한 건반에만 씁니다. */
function tFall(d, dB){
  const e = envMs(d,2);
  let pi=0; for(let i=1;i<e.length;i++) if(e[i]>e[pi]) pi=i;
  const th = e[pi]*Math.pow(10,-dB/20);
  for(let i=pi;i<e.length;i++) if(e[i] < th) return i-pi;
  return e.length-pi;
}
/** 기음 성분이 −dB 까지 떨어지는 ms. 현은 반드시 이쪽입니다 —
    광대역 포락선은 픽 어택이 죽는 속도를 재느라 pick 을 12ms 라고 합니다. */
function tFallAt(d, f, dB){
  const pts=[], tEnd=Math.min(2.4, d.length/SR-0.09);
  for(let t=0;t<tEnd;t+=0.02) pts.push([t, hGoertzel(d,f,t,t+0.08)]);
  let pi=0; for(let i=1;i<pts.length;i++) if(pts[i][1]>pts[pi][1]) pi=i;
  const th=pts[pi][1]*Math.pow(10,-dB/20);
  for(let i=pi;i<pts.length;i++) if(pts[i][1]<th) return Math.round((pts[i][0]-pts[pi][0])*1000);
  return Math.round((pts[pts.length-1][0]-pts[pi][0])*1000);   // 렌더 안에서 안 끝남
}

/** 포락선의 변조 주파수(Hz). dB 영역에서 직선 추세(감쇠)를 뺀 뒤 훑습니다 —
    안 그러면 감쇠가 «아주 느린 변조» 로 잡혀 트레몰로를 덮습니다. */
function amRate(d, t0, t1){
  const all = envMs(d,2).map(v => hdB(Math.max(v,1e-9)));
  const e = all.slice(Math.round(t0*1000), Math.round(t1*1000));
  if(e.length < 200) return null;
  let sx=0, sy=0, sxy=0, sxx=0; const n=e.length;
  for(let i=0;i<n;i++){ sx+=i; sy+=e[i]; sxy+=i*e[i]; sxx+=i*i; }
  const sl=(n*sxy-sx*sy)/(n*sxx-sx*sx), ic=(sy-sl*sx)/n;
  let best=0, bf=null;
  for(let f=0.3; f<=20; f+=0.02){
    let re=0, im=0;
    for(let i=0;i<n;i++){ const w=2*Math.PI*f*i/1000, x=e[i]-(sl*i+ic); re+=x*Math.cos(w); im+=x*Math.sin(w); }
    const m=Math.sqrt(re*re+im*im); if(m>best){ best=m; bf=f; }
  }
  return bf;
}

/** 초기 창에서 «st 반음 아래» 성분이 제 음보다 얼마나 센가.
    41Hz 기음을 30ms 창으로는 못 가르므로 절대 음정을 찾는 대신
    원 악기와 이 비를 견줍니다 — 굽혀 들어오면 비가 확 올라갑니다. */
const gRatio = (d,f,st,a,b) =>
  hGoertzel(d, f*Math.pow(2,-st/12), a, b) / Math.max(hGoertzel(d,f,a,b), 1e-12);

/** 그 주파수 성분이 처음 서는 시각(ms) — 스트로크에서 줄이 들어오는 순서 */
function entryMs(d, f, win){
  const m=[]; for(let t=0;t<0.16;t+=0.001) m.push([t, hGoertzel(d,f,t,t+win)]);
  let mx=0; for(const x of m) if(x[1]>mx) mx=x[1];
  for(const x of m) if(x[1] >= mx*0.3) return Math.round(x[0]*1000);
  return null;
}

/** 배음 기울기 dB/oct — 밝기를 배음 구조로 보는 자(하네스 hTilt) */
const tilt = a => hTilt(a.hRel);

/** 여러 빈을 합친 대역 세기. 노이즈 악기는 한 빈만 보면 렌더마다 흔들립니다 —
    스네어 어택 중심이 한 번은 1523Hz, 다음은 2265Hz 로 나왔습니다. */
const bandMag = (d,fs,a,b) => { let s=0; for(const f of fs) s+=hGoertzel(d,f,a,b); return s; };

/** 본음 24ms 앞에 소리가 있는가 — 플램의 장식음.
    포락선 피크에서 leadMs 앞을 피크 대비 dB 로 돌려줍니다. */
function preBeatDb(d, leadMs){
  const e = envMs(d,4);
  let pi=0; for(let i=1;i<e.length;i++) if(e[i]>e[pi]) pi=i;
  return hdB(envAt(e,(pi-leadMs)/1000) / e[pi]);
}

/** 에너지의 시간 무게중심(ms) — «몇 번에 나눠 쳤는가» 를 정규화와 무관하게 봅니다.
    롤이 돌면 뒤로 밀립니다. 버퍼 피크 정규화(string.js)를 타지 않는 값입니다. */
function tCentroid(d, tEnd){
  let n=0, w=0; const N=Math.min(d.length, Math.round(tEnd*SR));
  for(let i=0;i<N;i++){ const e=d[i]*d[i]; n+=e*i; w+=e; }
  return w>0 ? n/w/SR*1000 : 0;
}

/* ── 판정 ────────────────────────────────────────────────── */
let nPass=0, nFail=0;
const seen = {};
function judge(eng, claim, got, pass){
  seen[eng]=1; if(pass) nPass++; else nFail++;
  log((pass?'  ✅ ':'  ❌ ') + eng.padEnd(18) + claim.padEnd(40) + got);
}

log('=== 주법 변형 검증 — 앱 코드 직접 로드 (OfflineAudioContext 48kHz) ===');
log('engines.js 의 주석이 주장하는 것을 수치로 옮겨 다시 봅니다.');
log('조건: velocity 1.0(드럼) / 0.9(톤) · Hum 0 · 모든 튠 노브 0');
log('«어택중심» 은 0~20ms · «지속중심» 은 0.03~0.23s 의 대역 무게중심입니다.\n');

/* ══ 1. 드럼 7종 ═══════════════════════════════════════════ */
log('── 드럼 7종 (snare 3 · chat 2 · ohat 2) ──');
{
  /* 크랙(3400Hz · 28ms)은 좁은 대역에 잠깐 얹힙니다. 대역 무게중심으로는
     못 봅니다 — 스네어는 노이즈라 중심이 렌더마다 700Hz 씩 흔들립니다.
     크랙 대역과 와이어 대역(하이패스 1150Hz 자리)의 비로 봅니다. 두 엔진은
     와이어가 같으므로(amp 만 평평하게 다름) 이 비가 크랙만 남깁니다. */
  const CRK=[3000,3200,3400,3600,3800], WIR=[900,1000,1100,1200,1300];
  const bodyD=await rDrum('snare','body'), rimD=await rDrum('snare','rimshot');
  const rb=bandMag(bodyD,CRK,0,0.05)/bandMag(bodyD,WIR,0,0.05);
  const rr=bandMag(rimD, CRK,0,0.05)/bandMag(rimD, WIR,0,0.05);
  judge('snare/rimshot','테를 때리는 3.4kHz «딱» 이 얹힌다',
        '크랙대역/와이어대역 '+rb.toFixed(2)+' → '+rr.toFixed(2), rr > rb*1.25);

  /* 장식음은 «타점을 세는» 방법으로는 못 봅니다 — 스네어 포락선에는 몸통
     삼각파(188·272Hz)의 잔물결이 있어 한 타가 두세 타로 세어집니다.
     본음 24ms 앞에 소리가 있는가만 봅니다. 그것이 플램의 정의입니다. */
  const pF=preBeatDb(await rDrum('snare','flam'),24), pB=preBeatDb(bodyD,24);
  judge('snare/flam','본음 24ms 앞에 약한 장식음이 있다',
        '앞선 24ms 잔량 body '+pB.toFixed(1)+' → flam '+pF.toFixed(1)+'dB',
        pF > pB + 10 && pF < -2);

  const bz = onsets(await rDrum('snare','buzzroll'), 9, 0.12, 18);
  const bg = gaps(bz);
  let avg='—'; if(bg.length){ let s=0; for(const g of bg) s+=g; avg=(s/bg.length).toFixed(0); }
  judge('snare/buzzroll','타점 7 · ~27ms · 갈수록 약하다',
        bz.length+'타 · 평균 '+avg+'ms',
        bz.length===7 && bg.every(g=>g>=22&&g<=32) && bz[6].amp < bz[0].amp);

  const cN=tFall(await rDrum('chat','noise'),20), cH=tFall(await rDrum('chat','half'),20);
  const oN=tFall(await rDrum('ohat','noise'),20), oH=tFall(await rDrum('ohat','half'),20);
  judge('chat/half','닫힌 햇보다 길고 열린 햇보다 짧다',
        'chat '+cN+' < half '+cH+' < ohat '+oN+' ms', cN < cH && cH < oN);
  judge('ohat/half','트랙이 달라도 길이가 같다(dAbs)',
        'chat '+cH+'ms vs ohat '+oH+'ms', Math.abs(cH-oH) <= Math.max(6, cH*0.15));

  /* metal 은 48ms 면 죽어 지속중심으로 견주면 꼬리를 재게 됩니다 — 어택으로 봅니다 */
  const cm=hAnalyze(await rDrum('chat','metal')), ch=hAnalyze(await rDrum('chat','halfmetal'));
  judge('chat/halfmetal','metal 보다 대역이 낮다(10k → 8.5k)',
        '어택중심 '+cm.centA.toFixed(0)+' → '+ch.centA.toFixed(0)+'Hz', ch.centA < cm.centA);
  const om=tFall(await rDrum('ohat','metal'),20), ohm=tFall(await rDrum('ohat','halfmetal'),20);
  judge('ohat/halfmetal','열린 햇 자리에서도 하프 오픈 길이',
        'ohat/metal '+om+' → '+ohm+'ms', ohm < om);
}
memo.clear();

/* ══ 2. 베이스 7종 (E1 = 41.2Hz) ═══════════════════════════ */
log('\n── 베이스 7종 (E1) ──');
{
  const E1 = 28, f0 = hHz(E1), A = {};
  for(const e of ['finger','slap','pick','upright','thumb','pop','bassharm','pickmute','uprightslap'])
    A[e] = hAnalyze(await rBass(e,E1,0.5), f0, {hStart:0.05,hEnd:0.35});

  judge('bass/thumb','finger 보다 어둡다',
        '지속중심 '+A.finger.cent.toFixed(0)+' → '+A.thumb.cent.toFixed(0)+'Hz'+
        '  (기울기 '+tilt(A.finger).toFixed(1)+' → '+tilt(A.thumb).toFixed(1)+'dB/oct)',
        A.thumb.cent < A.finger.cent);
  /* 지속부는 되레 어둡습니다 — β 0.24→0.28 로 줄 가운데에 가깝게 당기니
     고배음이 준 것이고, 팝의 밝기는 «스냅» 한 번에 있습니다. 어택으로 봅니다. */
  judge('bass/pop','어택의 «스냅» 이 slap 보다 밝다',
        '어택중심 '+A.slap.centA.toFixed(0)+' → '+A.pop.centA.toFixed(0)+'Hz'+
        '  (지속중심 '+A.slap.cent.toFixed(0)+' → '+A.pop.cent.toFixed(0)+')',
        A.pop.centA > A.slap.centA);
  judge('bass/bassharm','한 옥타브 위가 운다(shift 12)',
        'H2−H1 '+A.bassharm.hRel[1].toFixed(1)+'dB (finger '+A.finger.hRel[1].toFixed(1)+')',
        A.bassharm.hRel[1] > A.finger.hRel[1] + 6);
  const tPick=tFallAt(await rBass('pick',E1,0.5),f0,20), tPM=tFallAt(await rBass('pickmute',E1,0.5),f0,20);
  judge('bass/pickmute','pick 보다 짧다', '기음 −20dB '+tPick+' → '+tPM+'ms', tPM < tPick/2);
  judge('bass/uprightslap','upright 보다 밝다',
        '지속중심 '+A.upright.cent.toFixed(0)+' → '+A.uprightslap.cent.toFixed(0)+'Hz',
        A.uprightslap.cent > A.upright.cent);

  const sl=await rBass('bassslide',E1,0.5), fi=await rBass('finger',E1,0.5);
  const rS=gRatio(sl,f0*2,4,0,0.060), rF=gRatio(fi,f0*2,4,0,0.060);
  judge('bass/bassslide','4반음 아래에서 미끄러져 온다',
        '초기 낮은쪽/제음 '+rS.toFixed(2)+' (finger '+rF.toFixed(2)+')', rS > rF*3 && rS > 1.5);

  /* 설계는 85ms 지만 «피크의 90% 에 처음 닿는 시각»(hAnalyze.atk)이라 활 잡음이
     섞여 89~113ms 사이에서 흔들립니다. 절대값이 아니라 finger 대비로 봅니다. */
  const ar = hAnalyze(await rBass('arco',E1,0.9));
  judge('bass/arco','활을 걸어야 줄이 움직인다(설계 85ms)',
        '어택 '+(A.finger.atk*1000).toFixed(0)+' → '+(ar.atk*1000).toFixed(0)+'ms',
        ar.atk > A.finger.atk*1.5 && ar.atk >= 0.060);
}
memo.clear();

/* ══ 3. 기타 11종 ══════════════════════════════════════════ */
log('\n── 기타 11종 (A2 = 110Hz · 스트로크만 A3) ──');
{
  const A2 = 45, f0 = hHz(A2), A = {};
  for(const e of ['clean','crunch','hi','nylon','harmonic','fingerpick','pinch','nylonharm'])
    A[e] = hAnalyze(await rGtr(e,A2,0.5), f0, {hStart:0.05,hEnd:0.30,nh:26});

  judge('gtr/harmonic','12프렛 하모닉스 — 2f0 가 f0 를 넘는다',
        'H2−H1 '+A.harmonic.hRel[1].toFixed(1)+'dB (clean '+A.clean.hRel[1].toFixed(1)+')',
        A.harmonic.hRel[1] > A.clean.hRel[1] + 6);
  judge('gtr/nylonharm','같은 것을 나일론에서',
        'H2−H1 '+A.nylonharm.hRel[1].toFixed(1)+'dB (nylon '+A.nylon.hRel[1].toFixed(1)+')',
        A.nylonharm.hRel[1] > A.nylon.hRel[1] + 6);
  const tCl=tFallAt(await rGtr('clean',A2,0.5),f0,20), tCh=tFallAt(await rGtr('chank',A2,0.5),f0,20);
  judge('gtr/chank','펑크 커팅 — clean 의 1/3 아래로 짧다',
        '기음 −20dB '+tCl+' → '+tCh+'ms', tCh < tCl/3);
  judge('gtr/fingerpick','픽보다 어둡다',
        '지속중심 '+A.clean.cent.toFixed(0)+' → '+A.fingerpick.cent.toFixed(0)+'Hz'+
        '  (기울기 '+tilt(A.clean).toFixed(1)+' → '+tilt(A.fingerpick).toFixed(1)+'dB/oct)',
        A.fingerpick.cent < A.clean.cent);
  judge('gtr/pinch','기음이 죽고 3·4배음이 산다',
        'H3 '+A.pinch.hRel[2].toFixed(1)+' · H4 '+A.pinch.hRel[3].toFixed(1)+
        'dB (hi H3 '+A.hi.hRel[2].toFixed(1)+')',
        Math.max(A.pinch.hRel[2], A.pinch.hRel[3]) > 0);

  /* 스트로크는 A3(220Hz)에서 봅니다 — A2 는 창이 한 주기(9ms)보다 길어야 해서
     16ms 차이를 못 가릅니다. +7 줄(1.5f0)은 루트의 배음이 아니라 섞이지 않습니다.
     내림 스트로크에서 +7 은 둘째 줄(1×16ms), 올림에서는 넷째 줄(3×11ms)입니다. */
  const A3 = 57, g3 = hHz(A3);
  const eD = entryMs(await rGtr('strum',  A3,0.5), g3*1.5, 0.012);
  const eU = entryMs(await rGtr('strumup',A3,0.5), g3*1.5, 0.012);
  judge('gtr/strum','+7 줄이 둘째로 들어온다(설계 16ms)',
        '+7 입장 '+eD+'ms', eD!=null && eD>=10 && eD<=28);
  judge('gtr/strumup','올림이라 +7 은 넷째다(설계 33ms)',
        '+7 입장 '+eU+'ms (내림 '+eD+')', eU!=null && eU>=26 && eU<=46 && eU>eD);

  const si=await rGtr('slidein',A2,0.5), cl=await rGtr('clean',A2,0.5);
  const r1=gRatio(si,f0*2,3,0,0.060), r0=gRatio(cl,f0*2,3,0,0.060);
  judge('gtr/slidein','3반음 아래에서 미끄러져 온다',
        '초기 낮은쪽/제음 '+r1.toFixed(2)+' (clean '+r0.toFixed(2)+')', r1 > r0*3 && r1 > 1.5);
  const bd=await rGtr('bend',A2,0.5), cr=await rGtr('crunch',A2,0.5);
  const r3=gRatio(bd,f0*2,2,0,0.060), r2=gRatio(cr,f0*2,2,0,0.060);
  judge('gtr/bend','온음 아래에서 밀어 올린다',
        '초기 낮은쪽/제음 '+r3.toFixed(2)+' (crunch '+r2.toFixed(2)+')', r3 > r2*3 && r3 > 1.5);

  /* 롤은 타점으로 못 셉니다 — 기타 포락선에는 어느 엔진에나 27ms 잔물결이 있어
     plain nylon 도 17타로 세어집니다. 그래서 «같은 엔진에서 rolls 만 뗀 것» 을
     만들어 견줍니다. 롤이 돌면 마지막 스트로크 시각까지 소리가 새로 채워집니다. */
  GTR._noroll_ras = (()=>{ const S={...GTR.rasgueado};
    delete S.rolls; delete S.rollGap; delete S.rollDecay; return S; })();
  GTR._noroll_trm = (()=>{ const S={...GTR.nylontrem};
    delete S.rolls; delete S.rollGap; delete S.rollDecay; return S; })();
  const tc = async e => tCentroid(await rGtr(e,A2,0.6), 0.5);
  const raOn=await tc('rasgueado'), raOff=await tc('_noroll_ras');
  judge('gtr/rasgueado','네 번에 나눠 친다(45ms 간격)',
        '에너지 무게중심 '+raOff.toFixed(0)+' → '+raOn.toFixed(0)+'ms', raOn > raOff + 20);
  const ntOn=await tc('nylontrem'), ntOff=await tc('_noroll_trm');
  judge('gtr/nylontrem','p-a-m-i — 네 번에 나눠 친다(65ms 간격)',
        '에너지 무게중심 '+ntOff.toFixed(0)+' → '+ntOn.toFixed(0)+'ms', ntOn > ntOff + 25);
  delete GTR._noroll_ras; delete GTR._noroll_trm;
}
memo.clear();

/* ══ 4. 건반 11종 (A3 = 220Hz) ═════════════════════════════ */
log('\n── 건반 11종 (A3) ──');
{
  const A3 = 57, f0 = hHz(A3), A = {};
  for(const e of ['strings','organ','ep','piano','epbark','pianosoft','felt'])
    A[e] = hAnalyze(await rKeys(e,A3,0.9), f0, {hStart:0.05,hEnd:0.35,nh:24});

  const tSt=tFall(await rKeys('strings',A3,0.9),20);
  const tPz=tFall(await rKeys('pizz',A3,0.9),20), tSc=tFall(await rKeys('staccato',A3,0.9),20);
  judge('keys/pizz','켜는 스트링과 달리 곧바로 잦아든다',
        '−20dB '+tSt+' → '+tPz+'ms', tPz < tSt/2);
  judge('keys/staccato','스웰 없이 짧게 튕긴다',
        '−20dB '+tSt+' → '+tSc+'ms', tSc < tSt/2);

  /* 바크는 «더 밝은» 게 아니라 «몸통이 으르렁거리는» 것입니다 — 1:1 쌍의 인덱스를
     키워 H2~H6 가 기음에 붙습니다. 타인(14f) 의 몫이 상대적으로 줄어 중심은 되레
     내려갑니다. 그게 로즈의 바크가 실제로 하는 일입니다. */
  const h26 = a => { let s=0; for(let i=1;i<6;i++) s+=a.hRel[i]; return s/5; };
  judge('keys/epbark','몸통 배음(H2~H6)이 기음에 붙는다',
        h26(A.ep).toFixed(1)+' → '+h26(A.epbark).toFixed(1)+'dB'+
        '  (중심 '+A.ep.cent.toFixed(0)+' → '+A.epbark.cent.toFixed(0)+'Hz)',
        h26(A.epbark) > h26(A.ep) + 6);
  judge('keys/pianosoft','우나 코르다 — 배음이 더 가파르게 준다',
        '기울기 '+tilt(A.piano).toFixed(1)+' → '+tilt(A.pianosoft).toFixed(1)+'dB/oct',
        tilt(A.pianosoft) < tilt(A.piano));
  const tPf=tFall(await rKeys('piano',A3,0.9),20), tFe=tFall(await rKeys('felt',A3,0.9),20);
  judge('keys/felt','펠트 — 더 어둡고 더 짧다',
        '기울기 '+tilt(A.piano).toFixed(1)+' → '+tilt(A.felt).toFixed(1)+
        'dB/oct · −20dB '+tPf+' → '+tFe+'ms',
        tilt(A.felt) < tilt(A.piano) && tFe < tPf);

  const fp = f0*Math.pow(2,19/12);
  const pOn = hGoertzel(await rKeys('organperc',A3,0.9), fp, 0.01, 0.08);
  const pOff= hGoertzel(await rKeys('organ',    A3,0.9), fp, 0.01, 0.08);
  judge('keys/organperc','누른 순간 3배음(+19)이 한 번 운다',
        '초기 +19 '+hdB(pOn).toFixed(1)+' vs organ '+hdB(pOff).toFixed(1)+'dB',
        pOn > pOff*1.6);

  /* ⚠ 팬이 걸린 엔진(레슬리·수트케이스)은 왼쪽 채널만 봅니다 — L+R 은 팬의
     우함수라 모노로 합치면 변조가 두 배로 보입니다(eptrem 5.2 → 10.4Hz). */
  for(const spec of [['tremstr',11,1.6,0.25,1.5],['leslie',6.6,1.6,0.25,1.5],
                     ['eptrem',5.2,1.6,0.10,1.5],['chorale',0.8,4.6,0.30,4.4]]){
    const r = amRate(await rKeysL(spec[0],A3,spec[2]), spec[3], spec[4]);
    judge('keys/'+spec[0], '포락선이 '+spec[1]+'Hz 로 흔들린다',
          '실측 '+(r==null?'—':r.toFixed(2))+'Hz (L채널)',
          r!=null && Math.abs(r-spec[1]) <= Math.max(0.3, spec[1]*0.06));
  }

  /* 포르타멘토 — A3 다음에 한 옥타브 위를 칩니다. 둘째 음의 **시작** 피치가
     제 음(440Hz)이 아니라 앞 음(220Hz) 쪽이어야 합니다.
     ⚠ 절대 음정을 찾으면 안 됩니다 — lead 는 오실레이터 셋 중 하나가 한 옥타브
       위(semi 12)라, 미끄러져 오는 그 층이 440Hz 에 서 있어 «안 미끄러졌다» 로
       읽힙니다. 미끄러지지 않는 lead 와 220/440 세기비를 견줍니다. */
  const gl = await rKeys2('leadglide', A3, A3+12, 0.45);
  const ld = await rKeys2('lead',      A3, A3+12, 0.45);
  const rG = hGoertzel(gl,f0,0.462,0.482)/Math.max(hGoertzel(gl,f0*2,0.462,0.482),1e-12);
  const rL = hGoertzel(ld,f0,0.462,0.482)/Math.max(hGoertzel(ld,f0*2,0.462,0.482),1e-12);
  judge('keys/leadglide','둘째 음이 앞 음 높이에서 출발한다',
        '둘째 음 시작 220/440 세기비 '+rG.toFixed(2)+' (lead '+rL.toFixed(2)+')',
        rG > rL*3 && rG > 1);
}
memo.clear();

/* ══ 5. 빠진 주법이 없는가 ═════════════════════════════════
   위 표는 손으로 적은 것이라, ENGINES 에 주법을 하나 더 얹고 여기에 안 적으면
   조용히 안 검사됩니다. 그 구멍을 마지막에 셉니다. */
log('\n── 검사 범위 ──');
const TECH = {
  snare:['rimshot','flam','buzzroll'], chat:['half','halfmetal'], ohat:['half','halfmetal'],
  bass :['thumb','pop','bassharm','bassslide','pickmute','uprightslap','arco'],
  keys :['pizz','tremstr','staccato','leslie','chorale','organperc','eptrem','epbark',
         'pianosoft','felt','leadglide'],
  gtr  :['harmonic','chank','strum','strumup','fingerpick','slidein','bend','pinch',
         'rasgueado','nylontrem','nylonharm'],
};
let nTech=0; const missing=[], ghost=[];
for(const tr of Object.keys(TECH)) for(const e of TECH[tr]){
  nTech++;
  if(!ENGINES[tr][e]) ghost.push(tr+'/'+e);
  else if(!seen[tr+'/'+e]) missing.push(tr+'/'+e);
}
log('주법 '+nTech+'종 · 검사 '+(nPass+nFail)+'건');
if(ghost.length)   log('❌ ENGINES 에 없는데 표에 적힌 것: ' + ghost.join(' '));
if(missing.length) log('❌ 표에 있으나 위에서 안 잰 것: ' + missing.join(' '));
if(!ghost.length && !missing.length) log('✅ 주법 '+nTech+'종이 모두 한 번 이상 측정됐습니다');

log('\n'+(nFail?'❌':'✅')+' 통과 '+nPass+' · 실패 '+nFail);
log('\n검증 완료');
window.__fail = nFail + ghost.length + missing.length;
window.__done = true;
}catch(err){
  log('\n!! 검증 실패: ' + (err && err.stack ? err.stack : err));
  window.__fail = 1; window.__done = 'error';
}
})();
</script>
