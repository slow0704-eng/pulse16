<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>BiquadFilter Q 단위 검증</title>
<style>body{font-family:monospace;background:#16191d;color:#e6e1d6;padding:20px;font-size:12px}
pre{white-space:pre-wrap}b{color:#e8a33d}</style>
<pre id="out"></pre>
<script type="module">
const log=m=>{document.getElementById('out').textContent+='\n'+m;};
const SR=48000, dB=x=>x<1e-12?-Infinity:20*Math.log10(x);
function magAt(d,f,from){const N=d.length-from,w=2*Math.PI*f/SR,c=2*Math.cos(w);
  let s1=0,s2=0;for(let i=from;i<d.length;i++){const s0=d[i]+c*s1-s2;s2=s1;s1=s0;}
  return 2*Math.sqrt(s1*s1+s2*s2-c*s1*s2)/N;}

/* 컷오프와 정확히 같은 주파수의 사인을 넣는다.
   2-pole 로우패스는 컷오프에서 이득 = 선형 Q.
   Q 파라미터가 선형이면 gain=Q, dB 단위면 gain=10^(Q/20). */
async function gainAtCutoff(type, qParam, f0){
  const ctx=new OfflineAudioContext(1,SR*0.5,SR);
  const o=ctx.createOscillator(); o.type='sine'; o.frequency.value=f0;
  const g=ctx.createGain(); g.gain.value=0.1;          // 선형 구간
  const bq=ctx.createBiquadFilter(); bq.type=type;
  bq.frequency.value=f0; bq.Q.value=qParam;
  o.connect(g).connect(bq).connect(ctx.destination); o.start(0);
  const b=await ctx.startRendering();
  return magAt(b.getChannelData(0),f0,Math.floor(SR*0.3))/0.1;
}

/* getFrequencyResponse 로도 교차 확인 — 렌더링과 독립된 경로 */
function respAtCutoff(type,qParam,f0){
  const ctx=new OfflineAudioContext(1,128,SR);
  const bq=ctx.createBiquadFilter(); bq.type=type;
  bq.frequency.value=f0; bq.Q.value=qParam;
  const fArr=new Float32Array([f0]), mag=new Float32Array(1), ph=new Float32Array(1);
  bq.getFrequencyResponse(fArr,mag,ph);
  return mag[0];
}

log('<b>=== 검증: lowpass 의 Q 파라미터는 선형인가 dB 인가 ===</b>');
log('  2-pole 로우패스는 컷오프 주파수에서 이득 = 선형 Q');
log('  Q 파라미터가 선형 → 이득 = Q');
log('  Q 파라미터가 dB   → 이득 = 10^(Q/20)\n');
log('  Q값    선형이면   dB이면   실측(렌더)  실측(응답함수)   판정');
log('  ─────────────────────────────────────────────────────────────');
for(const q of [0.707,1.6,3,5,10,18.1]){
  const ifLin=q, ifDb=Math.pow(10,q/20);
  const meas=await gainAtCutoff('lowpass',q,1000);
  const resp=respAtCutoff('lowpass',q,1000);
  const verdict = Math.abs(meas-ifLin)<Math.abs(meas-ifDb) ? '선형' : 'dB';
  log(`  ${String(q).padStart(5)}  ${ifLin.toFixed(3).padStart(9)}  ${ifDb.toFixed(3).padStart(8)}  ${meas.toFixed(3).padStart(10)}  ${resp.toFixed(3).padStart(13)}   ${verdict}`);
}

log('\n<b>=== 교차 확인: highpass ===</b>');
log('  Q값    선형이면   dB이면   실측(응답함수)   판정');
for(const q of [1.6,5,10]){
  const resp=respAtCutoff('highpass',q,1000);
  const verdict = Math.abs(resp-q)<Math.abs(resp-Math.pow(10,q/20)) ? '선형' : 'dB';
  log(`  ${String(q).padStart(5)}  ${q.toFixed(3).padStart(9)}  ${Math.pow(10,q/20).toFixed(3).padStart(8)}  ${resp.toFixed(3).padStart(13)}   ${verdict}`);
}

log('\n<b>=== 교차 확인: bandpass (에이전트는 이건 선형이라고 주장) ===</b>');
log('  bandpass 는 중심주파수에서 이득 = 1 (Q 무관). 대신 -3dB 대역폭 = f0/Q 로 확인');
for(const q of [1.0,2.0,5.0]){
  const ctx=new OfflineAudioContext(1,128,SR);
  const bq=ctx.createBiquadFilter(); bq.type='bandpass';
  bq.frequency.value=1000; bq.Q.value=q;
  /* -3dB 지점을 탐색해 실측 Q 를 역산 */
  const fs=[],mag=new Float32Array(1),ph=new Float32Array(1);
  let lo=0,hi=0;
  for(let f=200;f<5000;f+=1){
    bq.getFrequencyResponse(new Float32Array([f]),mag,ph);
    if(!lo && mag[0]>=0.7071) lo=f;
    if(lo && mag[0]>=0.7071) hi=f;
  }
  const qMeas=1000/(hi-lo);
  log(`  Q=${q}  →  실측 Q = ${qMeas.toFixed(2)}   ${Math.abs(qMeas-q)<Math.abs(qMeas-Math.pow(10,q/20))?'선형':'dB'}`);
}

log('\n검증 완료');
</script>
